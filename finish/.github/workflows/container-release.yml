name: Container Build, Scan, and Push to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/container-release.yml'
  workflow_dispatch:

# ============================================================================
# TODO: DEMO - Secure Container Pipeline
#
# This workflow demonstrates:
# 1. Building a container image securely
# 2. Scanning the image for vulnerabilities
# 3. Blocking publication if scan fails
# 4. Using least-privilege permissions
#
# How to Demo:
# 1. Show the build step (multi-stage Dockerfile)
# 2. Show Trivy scanning the image
# 3. Explain why we fail on HIGH/CRITICAL (prevents malicious deployment)
# 4. Push to GHCR (GitHub Container Registry) - free hosting
# ============================================================================

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Minimal permissions: only what's needed
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # ====================================================================
      # Step 1: Set up Docker Buildx for efficient builds
      # ====================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # ====================================================================
      # Step 2: Log in to GitHub Container Registry (GHCR)
      # Using the built-in GITHUB_TOKEN (more secure than personal tokens)
      # ====================================================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # ====================================================================
      # Step 3: Build and temporarily push image for scanning
      # We build with hardened Dockerfile (not Dockerfile.insecure)
      # ====================================================================
      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          outputs: type=docker,dest=/tmp/image.tar
          tags: ${{ github.repository }}:${{ github.sha }}
      
      # ====================================================================
      # Step 4: Load image into local Docker daemon for scanning
      # ====================================================================
      - name: Load image for scanning
        run: |
          docker load --input /tmp/image.tar
      
      # ====================================================================
      # Step 5: Security Gate - Scan with Trivy
      # Trivy checks for OS package vulnerabilities + supply chain risks
      # ====================================================================
      - name: 'Security Gate: Scan container image with Trivy'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ github.repository }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
      
      # ====================================================================
      # Step 6: Upload Trivy results to GitHub Security Tab
      # Allows team to view vulnerabilities in the Security tab
      # ====================================================================
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
      
      # ====================================================================
      # Step 7: BLOCK PUBLICATION if vulnerabilities found
      # We only push to registry if scan passed (no HIGH/CRITICAL)
      # ====================================================================
      - name: 'Conditional Push: Only push if scan passed'
        if: success()  # Only execute if all previous steps succeeded
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
      
      # ====================================================================
      # Step 8: Output scan results summary
      # ====================================================================
      - name: Print scan results summary
        if: always()
        run: |
          echo "=========================================="
          echo "Container Security Scan Summary"
          echo "=========================================="
          echo "Image: ${{ github.repository }}:${{ github.sha }}"
          echo "Scan Status: $([ $? -eq 0 ] && echo 'PASSED ✓' || echo 'FAILED ✗')"
          echo ""
          echo "If scan FAILED:"
          echo "  - Do NOT merge code into main"
          echo "  - Review vulnerabilities in GitHub Security tab"
          echo "  - Update base image to patched version"
          echo "  - Re-run workflow after fix"
          echo "=========================================="

# ============================================================================
# DOCUMENTATION: Container Scanning Gate Explained
#
# Why we scan BEFORE pushing to registry:
# 1. Prevents vulnerable images from being published
# 2. Blocks deployment pipelines automatically
# 3. Gives team time to remediate
#
# What Trivy checks:
# - OS packages (Alpine, Ubuntu, Debian, etc.)
# - Language libraries (npm, pip, maven, etc.)
# - Image configuration issues
#
# Why fail on HIGH/CRITICAL:
# - Prevents known exploitable vulnerabilities in production
# - LOW/MEDIUM can be reviewed and accepted if needed
#
# GHCR Benefits:
# - Free storage for public repos
# - Integrated with GitHub (CI/CD native)
# - No paid container registry needed
# ============================================================================
